; Plane Radar — supported boards
;
;   supermini  ESP32-C3 Super Mini + 1.28" round GC9A01 (240x240)   [upstream]
;   cyd        ESP32-2432S028 "Cheap Yellow Display":
;              ESP32-WROOM-32 + 2.8" 320x240 ILI9341, landscape
;   cyd-st7789 same board, for the newer revision that ships an ST7789 panel
;
; Build one with:  pio run -e cyd -t upload

[platformio]
; Plain `pio run` / `pio run -t upload` targets the NerdMiner-style 2.8"
; board. Pass -e explicitly for the others.
default_envs = cyd-st7789

[common]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; The Arduino framework forces -std=gnu++11 after build_flags, so drop it here.
build_unflags = -std=gnu++11

; LovyanGFX is pinned, not caret-ranged: 1.2.27 moved the fonts namespace and
; breaks the `namespace fonts = lgfx::v1::fonts;` aliases in src/ui/.
lib_deps =
  lovyan03/LovyanGFX@1.2.27
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]
extends = common
board = esp32-c3-devkitm-1

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DBOARD_SUPERMINI
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

[env:cyd]
extends = common
board = esp32dev
upload_speed = 921600

; Classic ESP32 talks to the host through the on-board CH340 UART bridge,
; so none of the native-USB CDC flags apply here.
build_flags =
  -std=gnu++17
  -DBOARD_CYD
  -DWM_NODEBUG
  -DWM_MDNS

; Later ESP32-2432S028 revisions ship an ST7789 in place of the ILI9341.
; Symptom of the wrong pick: garbled or shifted image, or a blank backlit screen.
[env:cyd-st7789]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -DCYD_PANEL_ST7789
