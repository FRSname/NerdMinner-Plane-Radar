# Tag a release (v1.0.0) to attach firmware to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build and merge
        run: |
          for env in cyd-st7789 cyd supermini; do
            pio run -e "$env"
            pio run -t merge -e "$env"
          done

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for env in cyd-st7789 cyd supermini; do
            out="dist/plane-radar-${env}-${VERSION}.bin"
            cp ".pio/build/${env}/firmware-merged.bin" "$out"
            sha256sum "$out" > "${out}.sha256"
          done
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      - name: Write flashing notes
        run: |
          cat > dist/FLASHING.md <<'EOF'
          | Image | Board | Chip | Flash offset |
          |-------|-------|------|--------------|
          | `plane-radar-cyd-st7789-*.bin` | 2.8" ST7789 (NerdMiner TPM408-2.8) | ESP32 | **0x1000** |
          | `plane-radar-cyd-*.bin` | 2.8" ILI9341 (Cheap Yellow Display) | ESP32 | **0x1000** |
          | `plane-radar-supermini-*.bin` | ESP32-C3 Super Mini + round GC9A01 | ESP32-C3 | **0x0** |

          The two 2.8" revisions look identical from outside. If the image is
          mirrored or sheared with one, flash the other.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
